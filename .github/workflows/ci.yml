name: Python CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy . --ignore-missing-imports

      - name: Test with pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term --cov-report=html

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify isolated built-wheel demo
        run: |
          python -m venv /tmp/autogenrec-artifact
          /tmp/autogenrec-artifact/bin/python -m pip install --upgrade pip
          /tmp/autogenrec-artifact/bin/python -m pip install dist/*.whl
          /tmp/autogenrec-artifact/bin/python -m autogenrec --demo

      - name: Upload coverage to Codecov
        if: success() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-${{ matrix.python-version }}
